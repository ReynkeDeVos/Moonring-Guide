 +2 Angels-Punkte.`,`Findet Lebewesen hinter Hindernissen. Erhöht Tragfähigkeit und ermöglicht die Mace als Reserve.`,`Nicht alle möglichen Ziele sind dadurch schon sicher erreichbar.`),K(`drill-shot`,`Drill Shot`,`lady`,2,40,`PER 15`,`Weitere 2 Lady-Punkte: 25 Wildkräuter finden (+2) oder zwei tatsächlich gewonnene Erkundungstränen.`,`Schießt durch Körper und Stein. Gegner in einer Linie oder hinter Hindernissen sind gute Ziele.`,`Ausgerüstete Fernwaffe und eine passende Munition nötig. Nicht jedes normale Einzelziel braucht diese Gabe.`,`actions.lua:5049–5096`),K(`blind-leap`,`Blind Leap`,`angels`,2,40,`END 10`,`Insgesamt 3 Angels-Punkte; alle fünf Gottstädte besuchen liefert weitere +2.`,`Schafft Abstand auf einem sichtbaren, freien, begehbaren Feld.`,`Eigene Blindheit beachten. Lifesight vorher lernen.`,`actions.lua:5230–5250`),K(`revelation`,`Revelation`,`dust`,1,30,`INT 5`,`Barrow-Linn besuchen: +2 Dust-Punkte.`,`Deckt Fallen und verborgene Türen auf.`,`Erst Drill Shot und Blind Leap in dieser Kaufreihenfolge abschließen.`),K(`moonlight`,`Moonlight`,`lady`,5,120,`PER 20`,`Nach Garden of Lorelei: Lightning-bolt Amulet anlegen, max. Energie ≥120 und 5 freie Lady-Punkte prüfen.`,`Beschwört einen Helfer, während du mit dem Bogen aus Abstand weiterkämpfst.`,`Bei genau 120 Energie ist die Leiste anschließend leer. Energiebedarf für Heilung und Flucht berücksichtigen.`,`actions.lua:5198–5218; treasure_sets.lua:773–779`),K(`retribution`,`Retribution`,`angels`,2,80,`END 15`,`Insgesamt 5 Angels-Punkte: Ortsaufgaben plus eine Tear oder später 100 Untote.`,`Schutz gegen einen Treffer innerhalb eines begrenzten Zeitfensters, wenn der Abstand zusammenbricht.`,`Nach einem Treffer verbraucht. Teure Absicherung; normales Schießen und Positionieren tragen den Build.`,`actions.lua:5221`),K(`star-shot`,`Star Shot`,`lady`,3,60,`PER 25`,`Später 3 weitere Lady-Punkte; Fernkampf-, Kräuter- und Reliktaufgaben nutzen.`,`Kreisförmige Salve: acht Geschosse, jeweils doppelter normaler Sch  Nahkontakt.`,`Etwas mehr Ziel- und Energieplanung; Blutheilung ist kein Universalheilmittel.`],loop:[`Rückzugsfelder sichern und normale Bogenschüsse als Standard benutzen.`,`Bei verdeckten Zielen Lifesight; Drill Shot für lohnende Hindernisse oder Gegnerlinien.`,`Gash nur bei kontrolliertem Nahkontakt. Feast bei Heilbedarf an geeignetem Ziel; sonst mit Blind Leap Abstand schaffen.`,`Später Moonlight vor schweren Begegnungen. Star Shot für mehrere sinnvoll verteilte Gegner und mindestens 8 Munition.`],stats:`PER 25 · END 15 · INT 5 · STR 0 · FIN 0`,funding:`19 Devotion: Lady 13 · Angels 5 · Dust 1. Lady-Punkte aus Ortsbesuch, Kräutern, Fernkampf und später der Crimson Candle; Tears füllen Lücken.`}},Y=(e,t,n,r,i,a,o,s,c,l,u=!1)=>({id:e,title:t,region:n,direction:r,tasks:i.map((t,n)=>typeof t==`string`?{id:`${e}-${n}`,text:t}:t),gifts:a,gear:o,source:s,gate:c,hint:l,spoiler:u}),Te=[{id:`yarrow-stone-hint`,text:`Nach der Höhle mit dem Bewohner in Yarrow über den Black Eyed Stone sprechen. Er liest die Inschrift; nach Serpent's Eye fragen und seinem Hinweis auf die Priester in Moon-upon-Thoss folgen. Den Stein mitnehmen.`},{id:`prepare-1`,text:`Jetzt nach Moon-upon-Thoss: Mit Black Eyed Stone beim Priest of Balance nach Serpent's Eye → predecessor → Ruined Quarter fragen. Erst durch diese Antworten erfährst du den Namen Nevin und seinen Aufenthaltsort. Danach im nordwestlichen Ruinenviertel suchen und Nevin sagen. Seinen Antworten folgen: knew → truths → Serpents → hope → moons. Erst wenn er Roche erwähnt, nach Roche fragen; den Hinweis auf Barrow-Linn für den späteren Stadtbesuch notieren.`}];function Ee(e){let t=e===`wolf`;return[Y(`yarrow`,`Yarrow`,`Ankommen`,`Im Startdorf das südliche verfallene Gebäude und das Farmhaus durchsuchen; danach auf der Straße südwestwärts zur Hauptstadt.`,[`Im verfallenen Gebäude die Käfer besiegen, Carems Notiz lesen und Tiny Key nehmen.`,`Im Farmhaus die falsche Wand finden; die verschlossene Truhe öffnen und Graveyard Key nehmen.`],[],`Graveyard Key behalten. Noch keinen großen Kauf erzwingen. Mit Startausrüstung einzelne Gegner bekämpfen und Rückzug lernen.`,`YarrowTriggers.csv:6–8,17–18,22,30,36; world_data.lua:87; dungeon_data.lua:664–707; research-cemetery.md`,`Anfängerfalle: Die Höhle hinter dem Familienfriedhof vorerst auslassen. Der Eingang erlaubt keinen einfachen Rückweg; zum Verlassen brauchst du den Dungeon-Schlüssel. Nach ein bis zwei frühen Gottfertigkeiten zurückkehren: in dieser Route bereits in Etappe 3. Mit Startausrüstung direkt hineinzugehen kann schnell tödlich enden.`),Y(`capital`,`Moon-upon-Thoss`,`Ankommen`,`Von Yarrow auf der Straße südwestwärts zur Hauptstadt. Im Osten liegt die Street of the Gods.`,[`Priest of Balance ansprechen: Dreamless → become Archon → Relics → simple. Die kostenlose Devotional Tear erhalten.`,`Bei jedem der fünf anderen Priester nach relic fragen. Die Reliktaufgabe und Ortsnamen notieren.`,t?`Die erste Tear für Angels sparen: Sie schließt später die Lücke zu Retribution. Slam wird über Wintersholl bezahlt.`:`Die erste Tear der Lady zuordnen und Gash als erste Gabe kaufen.`],t?[]:[`gash`],t?`Heilreserve zuerst. Buckler nur bei Restgold (Basis 100); Dagger, Cap, Cotton Tunic und Leggings behalten. Shortsword erst mit STR 5.`:`Shortbow beim Weaponsmith: PER 5, Basis 1.000. Pfeile und Heiltränke zuerst einplanen.`,`DialogueData.csv:31–38,72,86,97–98,111–112,126–127`),...t?[Y(`winter`,`Wintersholl`,`Städtereise`,`Von der Hauptstadt zurück in Richtung Yarrow, dann ostwärts über die Straßen nach Wintersholl. Nach der Yarrow-Höhle mit dem Stein zur Hauptstadt zurückkehren.`,[`Wintersholl besuchen: +2 Wolf-Devotion. Slam kaufen, damit STR 5 erreichen.`,`Priester: Garden → not far → the beast → hunting grounds. Die Ziele markieren lassen.`,`Klagenden Bewohner: disgrace → rogue guardian → history → weapon → pirates → coast.`,{id:`winter-3`,text:`Fünf Hirsche sind ein später nachholbares Wolf-Ziel (+2 Punkte), keine Voraussetzung zum Weiterreisen. Laufen sie dir weg, nicht im Nahkampf hinterherjagen: erst eine tragbare Fernwaffe besorgen oder die Jagd verschieben. Hurl mit 2 freien Wolf-Punkten lernen; für die Yarrow-Höhle nicht darauf warten.`},{id:`winter-ranged-option`,text:`Frühe Jagdhilfe bei Bedarf: Crossbow beim Weaponsmith in Wintersholl oder der Hauptstadt (Basis 1.000) plus Bolts kaufen. Slam / STR 5 genügt; Shortbow braucht PER 5 und kommt im Plan erst nach Feast. Leichtes Jagdset: Shortsword + Cap + Cotton Tunic + Leggings + Crossbow = 36 / 40, Buckler dabei ablegen. Beide Waffen zählen zur Last. Nur kaufen, wenn danach Versorgungsgold bleibt; sonst weiterreisen und später zurückkommen.`},{id:`prepare-cemetery-check`,text:`Für die frühe Rückkehr nach Yarrow reicht als Orientierung zunächst Slam (STR 5) mit Shortsword oder vergleichbarer Waffe. Hurl kann als zweite Gabe helfen, ist hier keine Pflicht. Leichte Startausrüstung und gegebenenfalls Buckler behalten; Gesundheit, Poise, Energie und Heilreserve auffüllen.`},{id:`yarrow-2`,text:`Jetzt zurück nach Yarrow: Mit Graveyard Key zum Familienfriedhof nördlich der Farm und die Höhle abschließen. Gegner einzeln bekämpfen und bei sinkender Poise Abstand nehmen. Master Key und Black Eyed Stone aus der Haupttruhe nehmen, dann hinaus. Den Stein behalten und seine Inschrift erfragen.`},...Te],[`slam`,`hurl`],`Nach Slam: Shortsword ab STR 5 (1.000), mit Startkleidung + Buckler 30 / 40. Bei Jagdbedarf Crossbow (1.000) + Bolts statt weiterer Rüstung einplanen; mit Shortsword und Startkleidung ohne Buckler 36 / 40. Mit Hurl / STR 10 und genug Restgold direkt Sword (2.000) kaufen und Shortsword auslassen. Versorgung zuerst.`,`DialogueData.csv:51–59,131–148,198–220,422–425; achievements.lua:7–13; research-cemetery.md`,`Die Höhle ist ein früher Dungeon: ein bis zwei Gaben sind unsere Orientierung, keine feste Mindestanforderung. Für den Versuch weder Sword/STR 10 noch Lifesight/END 5 abwarten. Der Eingang bleibt bis zum Master Key gesperrt. Hurl erst mit 2 freien Wolf-Punkten; der Besuch bezahlt nur Slam. Hirschjagd und Fernwaffenkauf dürfen warten. Falls Hurl noch fehlt, darfst du Lifesight in Hearthaven und Feast in Red Grove vorziehen; ihre Ortsbesuche bezahlen die Gaben. Danach ist Shortbow für die spätere Jagd anlegbar.`),Y(`hearth`,`Hearthaven`,`Städtereise`,`Nach der Hauptstadtspur zum Stein über die Straßen nordwärts ins Gebirge nach Hearthaven.`,[`Hearthaven besuchen: +2 Angels-Devotion. Lifesight ist der geplante dritte Kauf. Wartet Hurl noch auf die Hirschjagd, Lifesight trotzdem jetzt lernen: END 5 hilft bei der Last.`,`Priest of the Blind Angels: Relic → Tower of Veils → no way in.`,`Die Spur red cloak notieren; bei der nächsten Rückkehr nach Wintersholl mit Bewohnern darüber sprechen. Die Spur führt nach Harrowdus.`],[`lifesight`],`Nach Lifesight nicht das ganze Lederset kaufen. Erst bei Restgold Leather Armour statt Cotton Tunic (800): mit Sword + Starthelm/-beinen + Buckler Last 39 / 50,71. Optionale Gloves: 41. Cap und Leggings zunächst behalten.`,`DialogueData.csv:175–177,210–211; ObjectData.csv`),Y(`red`,`The Red Grove`,`Städtereise`,`Von Hearthaven zurück über die Straßen Richtung Westen/Südwesten nach The Red Grove.`,[`The Red Grove besuchen: +2 Lady-Punkte. Feast ist der geplante vierte Kauf. Falls Hurl noch fehlt, Feast vorziehen: PER 5 macht Shortbow für die spätere Jagd anlegbar.`,`Von einem Bewohner Blood is all erfahren und dies der Handmaiden sagen.`,`Handmaiden: Candle → Necropolis → brave its tombs → not enough → solvent → Endera. Fünf Endera Herbs als späteres Ziel notieren.`],[`feast`],`Nach Feast / PER 5 ist Shortbow beim Weaponsmith in Red Grove oder der Hauptstadt anlegbar (Basis 1.000 + Arrows, Last 10). Für die aufgeschobene Hirschjagd jetzt erwägen. Mit Shortsword + Startkleidung + Buckler 40 / 50,71 bei END 5; mit Sword 42. Eine vorhandene Crossbow weiter benutzen oder ersetzen; nicht beide kaufen müssen. Heilung und Oil zuerst. Oil heilt Rot, bietet keine vorbeugende Immunität.`,`DialogueData.csv:363–380; speech_area.lua:18`)]:[Y(`red`,`The Red Grove`,`Städtereise`,`Von Moon-upon-Thoss auf den westlichen Straßen nordwestwärts nach The Red Grove. Danach über Yarrow und die Friedhofshöhle mit dem Stein zur Hauptstadt zurückkehren.`,[`Besuch gibt +2 Lady-Devotion. Feast als zweiten Kauf lernen: PER 10 erreichen.`,`Bewohner nach Blood is all fragen und dies der Handmaiden sagen.`,`Handmaiden: Candle → Necropolis → brave its tombs → not enough → solvent → Endera. Für später fünf Endera Herbs notieren.`,`Auf allen Reisen Wildkräuter aufnehmen. Insgesamt 25 Wildkräuter geben +2 Lady-Punkte für den späteren Drill-Shot-Kauf.`,{id:`prepare-cemetery-check`,text:`Gash und Feast sind jetzt deine ersten beiden Gaben. Mit Shortbow, passenden Pfeilen und Dagger als Nahkampfreserve nach Yarrow zurück; Longbow und Lifesight brauchst du für diesen frühen Versuch nicht abzuwarten. Leichte Startausrüstung behalten und Gesundheit, Poise, Energie sowie Heilreserve auffüllen.`},{id:`yarrow-2`,text:`Mit Graveyard Key zum Familienfriedhof nördlich der Farm in Yarrow und die Höhle abschließen. Gegner einzeln bekämpfen und bei sinkender Poise Abstand nehmen. Master Key und Black Eyed Stone aus der Haupttruhe nehmen, dann hinaus. Den Stein behalten und seine Inschrift erfragen.`},...Te],[`feast`],`Longbow ab PER 10 (5.000); ein Zwischenkauf ist keine Pflicht. Shortbow weiter benutzen, wenn Pfeile und Heilung sonst unbezahlbar werden. Longbow + Dagger + Startkleidung: Last 30 / 40; mit Buckler schon 40, deshalb keine weitere Last ergänzen.`,`DialogueData.csv:51–59,131–148,363–380,422–425; achievements.lua:45–51; ObjectData.csv; research-cemetery.md`,`Ein bis zwei Gaben sind unsere Orientierung für die frühe Höhle, kein garantierter Sieg. Der Eingang bleibt bis zum Master Key gesperrt. Feast hilft nur gegen geeignete Gegner; Heiltränke behalten.`),Y(`hearth`,`Hearthaven`,`Städtereise`,`Nach der Hauptstadtspur zum Stein über die Straßen nordwärts ins Gebirge nach Hearthaven.`,[`Hearthaven besuchen: +2 Angels-Devotion. Lifesight als dritten Kauf lernen.`,`Priest of the Blind Angels: Relic → Tower of Veils → no way in. Die Spur red cloak notieren.`],[`lifesight`],`Dagger als leichte Reserve behalten. Mace wäre ab END 5 anlegbar (1.000), aber Longbow + Mace + Startkleidung + Gloves + Buckler wiegen 50 / 50,71. Als Standard bis END 10 warten; zuerst nur einen bezahlbaren Slot verbessern.`,`DialogueData.csv:175–177; ObjectData.csv`),Y(`winter`,`Wintersholl`,`Städtereise`,`Zurück Richtung Yarrow, dann ostwärts nach Wintersholl.`,[`Priester: Garden → not far → the beast → hunting grounds. Die Ziele markieren lassen.`,`Bewohner nach red cloak fragen: die Tower-Schlüsselspur führt nach Harrowdus.`,`Klagenden Bewohner: disgrace → rogue guardian → history → weapon → pirates → coast. Die besondere Waffe für Sleathen notieren.`],[],`Hier keine STR-Waffe für diesen Build kaufen. Bögen aus Hauptstadt/Red Grove behalten; die Wolf-Punkte vom Besuch vorerst liegen lassen.`,`DialogueData.csv:198–220`)],Y(`harrow`,`Harrowdus`,`Städtereise`,`Von Wintersholl südwärts über die Straßen nach Harrowdus.`,[`Bewohner: furtive → Although → triangular key → Barrow-Linn. Die Tower-Schlüsselspur verfolgen.`,`Priester: Relic → die → insist → phrase. Die Jest-Zugangsphrase als Rätsel aufnehmen.`,`Sprechende Gans: secrets → Bael's Key → Idiot → However.`,`Im nordöstlichen Haus die verschlossene Tür mit Lockpick öffnen und die Notiz lesen. Den dort genannten Bewohner Espirus nach literature und click-clack gang fragen.`],[],`Einige Lockpicks beim Ironmonger (Basis 200), Oil und Heilung beim Apothecary. Vor der nächsten Stadt auffüllen: Barrow-Linn hat keinen Apothecary.`,`DialogueData.csv:243–248,263–287; HarrowdusTriggers.csv:21; village_sim.lua:53`),Y(`barrow`,`Barrow-Linn`,`Städtereise`,`Zur Hauptstadt zurück, die Fähre südwestwärts nehmen; vom Fährort nordwestlich nach Barrow-Linn.`,[`Priester: Relic → Repository → unlikely → Locus Box → functioning → parts → Roche → still lives.`,`Bewohner nach triangular key → Funny fragen. Flimpy: fence → guess. Die Spur führt zu Kenner in The Red Grove.`,`In der Ancestors' Ossuary die falsche Wand finden und Bael's Key nehmen. Für die mögliche alternative Schlussroute behalten.`,`Prüfen: alle fünf Gottstädte besucht. Das gibt +2 Angels-Punkte; Barrow-Linn selbst gibt +2 Dust-Punkte.`],t?[`blind-leap`,`revelation`]:[],`Vorher gekaufte Heilung behalten. Waffen und Rüstung gibt es hier, Heiltränke jedoch nicht regulär bei einem Apothecary.`,`DialogueData.csv:316–340; ancestorsTriggers.csv:4; achievements.lua:32–39,56–65`),Y(`prepare`,`Spuren verbinden`,`Vor dem ersten Relikt`,`The Red Grove erneut besuchen, dann nach Moon-upon-Thoss zurückkehren.`,[`In The Red Grove: stranger → Kenner → fled → Moon-upon-Thoss. In der Hauptstadt Bewohner nach Kenner fragen, bis Thief's Hideout markiert wird.`,{id:`prepare-2`,text:t?`Nächste Käufe vorbereiten: Hallow, dann Retribution. Hallow kann bis zu den Garden-Belohnungen warten; die erste gesparte Tear ergänzt Angels für Retribution.`:`Mit 2 zusätzlichen Lady-Punkten Drill Shot lernen; danach Blind Leap und Revelation. Kräuteraufgabe oder tatsächlich gewonnene Tears nutzen.`},{id:`prepare-3`,text:`Heilung, passende Munition, Hotkeys und aktuelle Last prüfen. Lange Reliktdungeons erst vorbereitet betreten.`}],t?[`hallow`,`retribution`]:[`drill-shot`,`blind-leap`,`revelation`],t?`Sword + Schild behalten. Bei END 10 Greaves und Heater einzeln nach Lastprüfung ergänzen; volles Lederset + Sword + Heater + Amulett wiegen 56 / 61,43. Mit vorhandener Fernwaffe leichtere Rüstung oder Buckler behalten: Shortbow ergänzt 10, Crossbow 16. Das volle 56er-Set plus Shortbow erst bei END 15 tragen; Hurl kann die Fernwaffe ersetzen.`:`Longbow nur bei Restgold; Dagger bleibt eine leichte Reserve. Mace ist optional. Bei END 10 passt mit Mace zunächst Lederkörper plus Starthelm/-beine; volles Lederset + Round Shield erst bei END 15.`,`world_data.lua:87; dungeon_data.lua:664–707; treasure_sets.lua:767–770; DialogueData.csv:57–59,148,385–394,504,507; achievements.lua; research-cemetery.md`,`Punkte sind keine automatische Questbelohnung. Fehlende Gaben verzögern den Kauf, nicht deine ganze Reise. Falls die Yarrow-Höhle oder die Hauptstadtspur zum Stein noch offen ist, die Aufgaben aus Etappe 3 nachholen und den Black Eyed Stone behalten.`,`Tears aus Rätselorten sind optional: Delera nördlich Hauptstadt, Issera südöstlich davon, Soccera nördlich Harrowdus, Hasera südlich davon. Rätsel lösen UND den Wächter besiegen. Spektrale Ritter können sehr gefährlich sein; später zurückkehren ist sinnvoll.`),Y(`hold`,`The Hold`,`Erstes Relikt`,`Von Wintersholl zur südwestlichen Küste. The Hold liegt nahe Fieracarr.`,[`The Hold abschließen und die garantierte Tooth of Sleathen aus dem Endschatz nehmen.`,`Zur Stadt zurückkehren, Heilung auffüllen und die besondere Waffe für den nächsten Kampf bereithalten.`],[],`Tooth of Sleathen ist ein Fund, kein Ladenkauf. Nicht mit The Hole verwechseln – das ist ein anderer Dungeon.`,`world_data.lua:110; dungeon_data.lua:525–553; treasure_sets.lua:883–886`),Y(`garden`,`Sleathen & Garden`,`Erstes Relikt`,`Sleathens Wald liegt nordwestlich Wintersholl; Garden of Lorelei liegt nördlich der Stadt.`,[`Tooth of Sleathen wirklich als Nahkampfwaffe ausrüsten, dann Sleathen besiegen und Sleathen's Head einsammeln. Keine Attributanforderung, einhändig, Last 10: Schild behalten; beim Wechsel von Dagger (Last 4) die zusätzliche Last prüfen.`,`Mit dem Kopf Garden of Lorelei öffnen. Sieben Etagen und Lord of Trees bewältigen; Steadfast Hand und Endtruhe nehmen.`,`Lightning-bolt Amulet anlegen: bei 100 Basisenergie auf 120 maximale Energie kommen. Die zusätzliche Halslast 1 prüfen.`,t?`Howl als neunten Kauf erst lernen, wenn auch die vorherigen Gaben und 5 freie Wolf-Punkte vorhanden sind.`:`Moonlight als siebten Kauf erst lernen, wenn auch die vorherigen Gaben und 5 freie Lady-Punkte vorhanden sind.`],t?[`howl`]:[`moonlight`],`Lightning-bolt Amulet ist hier beim ersten Abschluss garantiert. Für neutrale Beschwörungen vorerst dieses Amulett tragen.`,`ActorData.csv:175; world_data.lua:148–154; treasure_sets.lua:773–779`,`Sleathen ist auch für den Bogen-Build ein besonderer Nahkampf. Slam, Feast und Retribution umgehen seine spezielle Waffenregel nicht.`,`Vor einem siebenstöckigen Reliktdungeon die Warnung des Spiels beachten: kein einfacher Rückzug durch den Eingang wie in einem Außenareal.`),Y(`ship`,`Schiff & Sea Cave`,`Weitere Relikte`,`Harrowdus → südwestliches Click Clack Hideout; danach zum Schiff bei Moon-upon-Thoss.`,[`Im Click Clack Hideout die Assassinen einzeln bekämpfen, dann den Leader. Mit seinem Schlüssel die Truhe öffnen: Forged Ship Title nehmen.`,`Zum Schiff neben Moon-upon-Thoss gehen und den Titel nutzen. Die Kaufalternative kostet ungefähr 100.000 Basisgold und ist für diese Route unnötig.`,`Mit dem Schiff die Sea Cave südlich der Hauptstadt abschließen. Advanced Cannon mitnehmen.`],[],`Heilung und Pfeile vor dem Hideout ergänzen. Den erkämpften Forged Ship Title nutzen; Advanced Cannon ist ein Dungeonfund.`,`ClickclackTriggers.csv:2–12; treasure_sets.lua:863–869; help.lua:60–67`),Y(`tower`,`Tower of Veils`,`Weitere Relikte`,`Kennerinsel nordöstlich Wintersholl, südöstlich des großen Meereskreuzes; danach Tower südwestlich Hearthaven.`,[`Thief's Hideout auf der markierten Kennerinsel anfahren und besiegen. Tower Keys nehmen.`,`Tower of Veils mit den Schlüsseln öffnen und abschließen. All-seeing Eye und Amulet of Wintertree aus dem Endschatz mitnehmen.`],t?[`shockwave`]:[`retribution`],`Wintertree-Amulett als Feuerabwehr merken. Ein Wechsel ersetzt das Energie-Amulett: neutrale Beschwörungen brauchen weiterhin max. 120 Energie.`,`OverworldTriggers.csv:93,126; treasure_sets.lua:806–812`,`Die hier vorgeschlagenen späten Gaben erst kaufen, wenn ihre vorherigen Käufe und Punkte vorhanden sind.`,`Boss-Hilfe: Almas' Dunkelheit und Schild über alle vier Braziers auflösen. In der Dunkelheit keine Schläge auf das Schild verschwenden.`),Y(`jest`,`Jest`,`Weitere Relikte`,`In Harrowdus in den Grocer-Rückraum; hinter der falschen Wand liegt der Eingang.`,[`Die fünf Wörter und die Rätselnotiz des Priesters zusammentragen. Unter „Geheimnisse“ nur tatsächlich gefundene Hinweise bestätigen; die Zugangslösung wird erst mit allen Hinweisen freigegeben.`,`Die vollständige Phrase in Eingangsnähe rufen. Sieben Etagen abschließen; Trickster's Mask und Heart-shaped Amulet nehmen.`],t?[]:[`star-shot`],`Feuer-/Statusreserve und genügend Munition. Bei Wintertree-Wechsel Energiegrenze neu prüfen. Star Shot braucht 8 Pfeile/Bolzen pro Einsatz.`,`strings.lua:83–86; HarrowdusTriggers.csv:11; actor_boss.lua:945–1072`,void 0,`Boss: „says“ bedeutet befolgen; „laughs“ bedeutet das Gegenteil. Nicht pauschal alles umkehren. Die Zugangslösung steht unter „Geheimnisse“ erst nach Bestätigung aller Hinweise bereit.`),Y(`necropolis`,`Necropolis`,`Weitere Relikte`,`Von Harrowdus zuerst zur Kräutergruppe nordwestlich der Stadt, danach zur Gruppe westlich der Enflamed Glade. Sobald du fünf Herbs hast, zur Handmaiden in The Red Grove.`,[`Falls du die Fundorte noch nicht kennst: Beim Ironmonger (Hardware Store) im Südwesten von Harrowdus Treasure Map #6 und #8 kaufen, jeweils Basis 2.000. Nur benötigte Karten kaufen. Auf Land: I → Karte auswählen → Enter → Read bestätigen; dann der neuen Weltkartenmarkierung folgen. Kräuterorte heißen anfangs „a secret location“ / „???“.`,`Fünf Endera Herbs sammeln: zuerst die Vier-Stein-Gruppe nordwestlich Harrowdus (#6, Brücke an der Westseite), danach südwestlich Wintersholl die Gruppe direkt westlich Enflamed Glade (#8, Brücke südlich der Gruppe). Im Zentrum mit Enter in Lokalansicht wechseln und Kräuter aufnehmen. Bei fünf aufhören; weitere Quellen stehen unter „Wegdetails“.`,`Mit fünf Kräutern zur Handmaiden zurück: brew. Witches' Solvent bekommen; der Kauf für Basis 400.000 ist kein Anfängerziel.`,`Solvent am Necropolis-Zugang südöstlich The Red Grove verwenden. Sieben Etagen abschließen und Crimson Candle samt Endschatz nehmen.`],[],`Oil gegen Rot und passende Heilung. Karten sind Orientierungshilfen, kein Pflichtkauf. Kräuter aufnehmen und Geistern ausweichen; nicht jeden optionalen Kampf erzwingen.`,`ObjectData.csv:389–398,403; state_game.lua:22527–22533; speech_area.lua:18,2096–2100; witches_herb_Triggers.csv; DialogueData.csv:379`,`Fünf Kräuter sind erforderlich, nicht fünf getrennte Schreine. Bestand im Inventar zählen; ausgelassene Quellen sind kein Rückstand.`,`Alle Quellen, falls noch Kräuter fehlen: Map #6 = nordwestlich Harrowdus (298,295); #8 = westlich Enflamed Glade, südwestlich Wintersholl (303,267); #7 = nordwestlich Wintersholl und nordwestlich Sleathens Jagdgebiet (288,199); #9 = westlich und etwas südlich Barrow-Linn auf derselben Insel (171,293). Erst auf die Barrow-Insel reisen. #10 = Meida's Hideout südöstlich Red Grove, östlich und etwas südlich Poison Cross (231,207): Treppenabgang, Dungeon mit eingeschränktem Rückzug, eine garantierte Herb im Hauptschatz. Vorher volle Reserven. Die vier Steingruppen enthalten jeweils mehrere einzelne Kräuter; Meida allein ist keine Abkürzung zu fünf. Koordinaten sind nur sekundäre Rechercheanker; nutze Stadt, Landmarke und Kartenmarker.`),Y(`repository`,`Repository`,`Letztes Relikt`,`Empfohlener Sammelkurs: Harrowdus → Enflamed Glade → Venom Cube → Poison Cross → Bael's Tomb → Magma Chamber per Schiff. Danach Runacarr bei der Hauptstadt.`,[`Fehlende Orte markieren: beim Ironmonger im Südwesten von Harrowdus nur die benötigten Treasure Maps #1–#5 kaufen (Basis je 2.000). Auf Land mit I → Karte → Enter → Read lesen, dann den Weltkartenmarker verfolgen. Gelesene Karten werden verbraucht; die Markierung bleibt.`,`Enflamed Glade: Map #4. Südwestlich Wintersholl und nördlich Harrowdus, direkt östlich der Map-#8-Kräutergruppe. Per Schiff am Steg unmittelbar nördlich anlegen, dann südwärts zur Ruine. In Lokalansicht Feuerfallen beachten und Fragment aus dem Container nehmen.`,`Venom Cube: Map #2. Nordwestlich Wintersholl, nordöstlich Yarrow, im Inneren der großen ringförmigen Waldregion. Dem Marker folgen, Lokalansicht betreten und Fragment aus dem Container nehmen; Giftfallen und Gegner beachten.`,`Poison Cross: Map #1. Südöstlich The Red Grove und westlich Meida's Hideout. Vom südlichen Red-Grove-Ausgang dem Weg ost-/südostwärts durch den Berg-/Flussdurchgang über die Brücken folgen; die Ruine liegt zuletzt nördlich des Weges. Fragment aus dem Container nehmen; Giftfallen beachten.`,`Bael's Tomb: Map #3. Deutlich südlich The Red Grove, etwas westlicher als die Stadt; südöstlich Essacarr Henge. Den südlichen Weg über die Brücken verfolgen. Die Außenruine führt in einen Dungeon: vorbereitet abschließen und Fragment aus dem Hauptschatz nehmen. Dies ist nicht Bael's Key aus Barrow-Linn.`,`Magma Chamber: Map #5. Mit dem Schiff zur äußersten Südküste, südlich Moon-upon-Thoss und südwestlich Harrowdus. Am Steg an der Südseite der kleinen Landstelle anlegen, wenige Felder nordwärts zur Ruine. Amberfallen und Turrets beachten; Fragment aus dem Container nehmen.`,`Mit fünf Fragmenten entsteht automatisch Locus Box. An Runacarr benutzen, um Thossacarr sichtbar zu machen.`,`Über die Nordverbindung des Henges auf die Insel; vom Insel-Henge nordöstlich zum Repository. Dungeon abschließen; Pale Heart und Vermier's Amulet nehmen.`],[],`Magma Chamber braucht das Schiff. Heilung, Statusmittel und Fernangriff vorbereiten; Water gegen Feuer für Enflamed Glade. Karten nur für fehlende Orte kaufen; gegen Maschinen optional Sabotage erwägen.`,`ObjectData.csv:389–393; world_data.lua:66–70; state_game.lua:22502–22533; OverworldTriggers.csv; treasure_sets.lua:799–805,871–875`,`Hengeziele wirklich besuchen/sehen; nur eine Kartenmarkierung genügt nicht. Vor Bael's Tomb und Repository volle Reserven.`,`Sekundäre Rechercheanker: Poison Cross (217,204), Venom Cube (306,219), Bael's Tomb (173,228), Enflamed Glade (313,268), Magma Chamber (267,412). Folge den Kartenmarkern statt einer ungeprüften geraden Linie durch Berg oder Meer. Lens Keeper: zuerst Shield Crystals zerstören; nach Phasenwechsel erneut.`),Y(`egg`,`The Egg · DX`,`Vor dem Abschluss`,`Mit dem Schiff von Barrow-Linn südwestwärts zur weit westlichen, bergigen Küstenbucht. Von der Meeresseite an den nach Osten zeigenden Steg anlegen; an Land sechs Weltkacheln westwärts durch das Gehölz zum großen Ei.`,[`Nach den fünf Relikten die nummerierte Gabenliste und das späte END-15-Set fertigstellen. In einer Stadt gesund, mit voller Energie, Nahrung und Reserven starten. The Egg jetzt einschieben, bevor du eine der Schlussrouten beginnst.`,`Den Anleger und das Ei erreichen. Sekundäre Kartenanker: Steg (120,341), Ei (114,341), deutlich südwestlich Barrow-Linn. Kein gerader Landweg durch die umliegenden Berge.`,`Das große Ei anrempeln; danach auf den geöffneten Eingang gehen und Enter drücken. Die Einwegwarnung erst bestätigen, wenn du für den langen Dungeon bereit bist. Bei „Dee Ell See“ die DLC-Installation in Steam prüfen.`,`Den Lauf bis Etage 100 abschließen, den Preis aufnehmen und durch den dortigen Ausgang wieder an die Oberfläche zurückkehren. Danach in einer Stadt auffüllen und erst dann den Abschluss wählen.`],[],t?`Sword + Heater Shield, leichtes Lederset + Garden-Amulett: 56 Last. Hurl als Distanzhilfe; optionaler Shortbow ergänzt 10 auf 66 / 72,14 bei END 15. Heil-/Statusmittel, Nahrung, Water und Energieversorgung auffüllen.`:`Longbow + Mace + Round Shield, leichtes Lederset; das bisherige 68/72,14-Set behalten. Pfeile, Heil-/Statusmittel, Nahrung, Water und Energieversorgung auffüllen.`,`OverworldTriggers.csv:205,384; Overworld.png; actor.lua:4213–4234; state_game.lua:11463–11495; world_data.lua:205–314; research-egg.md`,`DX ist Zusatzinhalt; für diese Route ist es eingeplant. Zugang hat kein Relikt-Gate, die späte Einordnung ist unsere Vorbereitungsempfehlung. Auf Etage 1 gibt es keinen Rückweg nach draußen. Neutral Howl/Moonlight nur mit aktuell mindestens 120 maximaler Energie benutzen.`)]}var X=Array.from({length:100},(e,t)=>`egg-floor-${t+1}`),De=[{enemies:`Hive, Käfer, Fledermäuse, Spinnen, Wölfe und erste humanoide Gruppen. Minibosse können Dire Wolf, Hunter oder Spectral Knight sein.`,tip:`Die normale Kampfroutine trägt den Lauf. Früh prüfen, ob du Energie und Heilung zuverlässig einteilen kannst.`},{enemies:`Stärkere Varianten der frühen Gruppen; Dolls werden möglich.`,tip:`Vor unbekannten Türen deine Stellung und freie Rückzugsfelder sichern.`},{enemies:`Ghost Bats, Rotlings und Light Spectres; Gazer werden als Minibosse möglich.`,tip:`Rot- und Blindheitsmittel für später behalten. Die ersten leichten Etagen sind keine Zusage für den Rest.`},{enemies:`Silverwolves, Amberghasts und stärkere Untote; Reaper und Death-Maidens werden möglich.`,tip:`Sichtlinien und Status im Blick behalten. Ab Etage 34 können Bell-Räume bis zu zwei Bells vorsehen.`},{enemies:`Forgotten Hulks, Hunters, Creepers, Boggarts und Mimics; Darknight wird als Miniboss möglich.`,tip:`Räume und Truhen bewusst sichern. Ein vollständiges Leerräumen jeder Etage ist kein Pflichtziel.`},{enemies:`Bug Eyes, Ghosts und Blindwolves; Great Gazer wird als Miniboss möglich.`,tip:`Lifesight vor verdeckten Begegnungen nutzen. Keine sichere Auffüllung durch zufällige Beute erwarten.`},{enemies:`Borog, Techs, Impalers und Shimmershee; mechanische Gruppen werden möglich.`,tip:`Feast bleibt ein Gelegenheitswerkzeug. Unabhängige Heilung aufheben; ab Etage 67 sind bis zu drei Bells vorgesehen.`},{enemies:`Zusätzlich Constructs, Spikers, Bombers und Dice.`,tip:`Freie Bewegungsfelder und einen normalen Fernangriff bewahren. Teure Gaben gezielt einsetzen.`},{enemies:`Stärkere Techs/Constructs, Firewalkers und Piercers.`,tip:`Feuer- und Statusreserven vor weiterem Abstieg prüfen. Lebensmittel ersetzen keine HP-Heilung.`},{enemies:`Auf 91–99 stärkste Gruppen, einschließlich Dark Spectres. Reaper, Darknight und Great Gazer im Miniboss-Pool; 100 ist eine feste Abschlusskarte.`,tip:`Auf 99 vor dem Abstieg heilen, Status bereinigen und Energie, Munition sowie Amulett prüfen. Von Etage 100 führt keine normale Treppe zurück zu 99.`}];function Oe(e){if(e===100)return`Feste Abschlusskarte · Hilfe unten eingeklappt`;let t=[];return e%4==3&&t.push(`Maiden möglich`),e%4==0&&t.push(`Bells vorgesehen (bis ${e<=33?1:e<=66?2:3})`),e%7==6&&t.push(`Library vorgesehen`),(e===34||e===67)&&t.push(`Mehr Bells ab diesem Band`),e===99&&t.push(`Vor Abstieg zu 100 vorbereiten`),t.join(` · `)||`Abstieg, nötige Schlüssel, Reserven`}var ke={wolf:[{phase:`Start · END 0`,items:`Dagger 4 + Cap 1 + Cotton Tunic 8 + Leggings 1`,load:`14 / 40`,note:`Bereits vorhanden, kein Kauf. Die ausgerüsteten Startsteine haben Gewicht 0.`},{phase:`Slam · STR 5, END 0`,items:`Shortsword 10 + Cap 1 + Cotton Tunic 8 + Leggings 1 + Buckler 10`,load:`30 / 40`,note:`Nur Waffe und Schild gekauft. Dagger bleibt im Inventar; Handschuhe und Cloak sind keine Voraussetzung.`},{phase:`Optionale frühe Jagd · STR 5, END 0`,items:`Shortsword 10 + Cap 1 + Cotton Tunic 8 + Leggings 1 + Crossbow 16`,load:`36 / 40`,note:`Buckler für die Jagd ablegen; sonst 46 / 40. Mit Dagger statt Shortsword und Buckler wären es 40 / 40. Crossbow und Bolts nur bei echtem Bedarf kaufen.`},{phase:`Hurl · STR 10, END 0`,items:`Sword 12 + Cap 1 + Cotton Tunic 8 + Leggings 1 + Buckler 10`,load:`32 / 40`,note:`Sword ersetzt Shortsword oder direkt Dagger. Leather Gloves würden 2 Last ergänzen, sind aber optional.`},{phase:`Lifesight · STR 10, END 5`,items:`Sword 12 + Cap 1 + Leather Armour 15 + Leggings 1 + Buckler 10`,load:`39 / 50,71`,note:`Ein einzelner Körperkauf statt eines ganzen Ledersets. Mit Leather Gloves: 41; danach Leather Helmet statt Cap: 44. Beine noch behalten.`},{phase:`Blind Leap · STR 10, END 10`,items:`Sword 12 + Lederkörper/-handschuhe/-beine/-helm 27 + Heater Shield 16 + Lightning-bolt Amulet 1`,load:`56 / 61,43`,note:`Greaves und Heater einzeln ergänzen, Amulett nur nach Fund. Ohne Amulett 55; Shortbow zusätzlich wäre 66 und damit über der Grenze.`},{phase:`Retribution · STR 10, PER 5, END 15`,items:`Voriges 56er-Set + optional Shortbow 10`,load:`66 / 72,14`,note:`Shortbow erst mit PER 5, z. B. nach Feast. Ohne Bogen bei 56 bleiben. Woolen Cloak zusätzlich: 70; mehr Last kostet Bewegung und Dodge.`}],lady:[{phase:`Start · END 0`,items:`Dagger 4 + Cap 1 + Cotton Tunic 8 + Leggings 1`,load:`14 / 40`,note:`Bereits vorhanden, kein Kauf. Die ausgerüsteten Startsteine haben Gewicht 0.`},{phase:`Gash · PER 5, END 0`,items:`Shortbow 10 + Dagger 4 + Cap 1 + Cotton Tunic 8 + Leggings 1`,load:`24 / 40`,note:`Zuerst Bogen und Pfeile. Optional Buckler: 34. Kein Cloak- oder Rüstungskauf nötig.`},{phase:`Feast · PER 10, END 0`,items:`Longbow 16 + Dagger 4 + Cap 1 + Cotton Tunic 8 + Leggings 1`,load:`30 / 40`,note:`Nur bei genug Gold; Shortbow bleibt brauchbar. Mit Buckler bereits 40: keine Handschuhe oder Cloak zusätzlich anlegen.`},{phase:`Lifesight · PER 10, END 5`,items:`Longbow 16 + Dagger 4 + Cap 1 + Cotton Tunic 8 + Leggings 1 + Leather Gloves 2 + Buckler 10`,load:`42 / 50,71`,note:`Dagger weiter nutzen. Mace statt Dagger wäre 50: technisch passend, aber fast voll und mit Stealth −1. Für mehr Beweglichkeit den Kauf bis END 10 verschieben.`},{phase:`Blind Leap · PER 10, END 10`,items:`Longbow 16 + Mace 12 + Cotton Tunic 8 + Cap 1 + Leather Gloves 2 + Leggings 1 + Buckler 10 + Lightning-bolt Amulet 1`,load:`51 / 61,43`,note:`Mace erst ab END 5, Amulett nur nach Fund. Leather Armour statt Tunic ergänzt 7: dann 58. Ohne Amulett jeweils 1 weniger.`},{phase:`Retribution · PER 10, END 15`,items:`Longbow 16 + Mace 12 + Lederkörper/-handschuhe/-beine/-helm 27 + Round Shield 12 + Lightning-bolt Amulet 1`,load:`68 / 72,14`,note:`Helmet, Greaves und Round Shield einzeln ersetzen. Mit Dagger statt Mace nur 60. Cloak würde 72 ergeben; die freie Reserve lieber behalten.`}]},Ae={wolf:[{item:`Buckler: ein günstiger Anfang`,price:`100`,where:`Armourer · alle sechs Städte`,requirement:`Keine Stat-Schwelle · Gewicht 10`,action:`Nach der Heilreserve als ersten kleinen Kauf ergänzen. Cap, Cotton Tunic und Leggings behalten.`,load:`Startset 14 + Buckler 10 = 24 / 40 bei END 0.`,skip:`Bereits einen geeigneten Schild gefunden? Kauf auslassen. Heater direkt ist erlaubt, wenn 800 Gold nach der Reserve übrig bleiben und die aktuelle Last passt; dafür nicht den ersten Waffenkauf opfern.`},{item:`Dagger durch Shortsword oder direkt Sword ersetzen`,price:`Shortsword 1.000 · Sword 2.000`,where:`Weaponsmith · Shortsword überall, Sword nur Wintersholl`,requirement:`Shortsword STR 5 · Sword STR 10 · Gewicht 10 / 12`,action:`Nach Slam ist Shortsword anlegbar. Es hilft sofort, wenn du mit Dagger Probleme hast. Nach Hurl ist Sword anlegbar; bei STR 10 und genug Restgold direkt Sword kaufen.`,load:`Mit Startkleidung und Buckler: Shortsword 30 / 40; Sword 32 / 40. Der alte Dagger wird ersetzt.`,skip:`Du musst nicht beide kaufen. Dagger → Sword spart den Shortsword-Kauf, wenn du die Zwischenzeit sicher schaffst. Einen bereits gekauften Shortsword weiter benutzen, bis Sword bezahlbar ist; gleichwertige Beute ersetzt beide Käufe.`},{item:`Leather Gloves für den freien Handslot`,price:`300`,where:`Armourer · alle sechs Städte`,requirement:`Keine Stat-Schwelle · Gewicht 2`,action:`Erst nach brauchbarer Hauptwaffe und Heilreserve kaufen, wenn Geld übrig ist. Deine vier Startteile bleiben sonst erhalten.`,load:`Sword + Startkleidung + Buckler: 32 → 34 / 40 bei END 0.`,skip:`Bei knappem Gold verschieben. Ohne Handschuhe lässt sich der Weg fortsetzen; die folgenden Zahlen enthalten sie nur als Rechenbeispiel.`},{item:`Cotton Tunic durch Leather Armour ersetzen`,price:`800`,where:`Armourer · alle sechs Städte`,requirement:`Keine Stat-Schwelle · empfohlen ab Lifesight / END 5`,action:`Nur das Körperteil ersetzen, kein ganzes Lederset kaufen. Gewicht 8 → 15, Stealth −1. Bei knappem Geld die Cotton Tunic weiter tragen.`,load:`Mit Sword, Buckler, Cap, Leggings und Gloves: 34 − 8 + 15 = 41 / 50,71 bei END 5.`,skip:`Mit anderer Kombination kann Leder auch früher passen. Entscheidend ist die tatsächliche Gesamtlast; END 5 ist unsere Empfehlung, keine Anlegesperre.`},{item:`Cap durch Leather Helmet ersetzen`,price:`400`,where:`Armourer · alle sechs Städte`,requirement:`Keine Stat-Schwelle · Gewicht 1 → 4`,action:`Als nächsten einzelnen Rüstungskauf erwägen. Leggings bleiben an; Steel Helmet zunächst auslassen.`,load:`Voriges 41er-Set: 41 − 1 + 4 = 44 / 50,71 bei END 5.`,skip:`Cap ist bereits vorhanden und wird nicht erneut gekauft. Bei anderem Schild oder zusätzlicher Waffe erst die neue Last prüfen.`},{item:`Leggings durch Leather Greaves ersetzen`,price:`600`,where:`Armourer · alle sechs Städte`,requirement:`Keine Stat-Schwelle · empfohlen ab Blind Leap / END 10`,action:`Gewicht 1 → 6. Für etwas mehr Beinschutz zahlst du 600 und trägst 5 mehr; deshalb darf dieser Schritt warten.`,load:`Voriges 44er-Set: 44 − 1 + 6 = 49 / 61,43 bei END 10.`,skip:`Bei END 5 wären 49 / 50,71 schon fast voll. Leggings behalten, wenn dir Beweglichkeit oder Gold wichtiger sind.`},{item:`Buckler durch Heater Shield ersetzen`,price:`800`,where:`Armourer · alle sechs Städte`,requirement:`Keine Stat-Schwelle · Gewicht 10 → 16`,action:`25% statt 10% Basis-Blockchance, aber 6 mehr Last und Stealth −1. Als einzelnen Kauf durchführen; bei wenig Gold Buckler behalten.`,load:`Voriges 49er-Set: 49 − 10 + 16 = 55 / 61,43 bei END 10. Garden-Amulett nach Fund: 56.`,skip:`Mit leichterer Kleidung darf Heater früher kommen. Beispiel Sword + Startkleidung + Gloves + Heater: 40. Hast du Heater schon, Buckler auslassen; Kite ist keine Pflicht.`},{item:`Fernwaffe für Jagd oder regelmäßige Distanzangriffe`,price:`Shortbow oder Crossbow jeweils 1.000 · Munition extra`,where:`Weaponsmith · Shortbow Hauptstadt/Red Grove; Crossbow Hauptstadt/Wintersholl`,requirement:`Shortbow PER 5 nach Feast, Gewicht 10 · normale Crossbow STR 5 nach Slam, Gewicht 16`,action:`Diesen optionalen Kauf schon in Etappe 3 vorziehen, wenn dir Hirsche entkommen: Crossbow + Bolts hilft vor Hurl. Nach Feast ist der leichtere Shortbow + Arrows eine Alternative. Eine vorhandene Fernwaffe weiter benutzen; nicht beide kaufen müssen. Hurl kann den Kauf später ersetzen.`,load:`Frühe Crossbow mit Shortsword + Startkleidung ohne Buckler: 36 / 40; mit Buckler 46 und zu schwer. Shortbow + Sword + Startkleidung + Buckler: 42 / 50,71 bei END 5. Volles 56er-Lederset erst bei END 15: Shortbow 66, Crossbow 72 / 72,14.`,skip:`Fehlen Gold, passende Attribute oder Lastreserve, die Hirschjagd verschieben. END 15 ist nur für das volle schwere Vergleichsset nötig. Für eine frühe Jagd auf Rüstungskäufe verzichten und gegebenenfalls den Buckler ablegen.`}],lady:[{item:`Shortbow oder direkt Longbow kaufen`,price:`Shortbow 1.000 · Longbow 5.000 · Pfeile extra`,where:`Weaponsmith · Shortbow Hauptstadt/Red Grove; Longbow nur Red Grove`,requirement:`Shortbow PER 5 · Longbow PER 10 · Gewicht 10 / 16`,action:`Nach Gash ist Shortbow anlegbar. Dagger als Nahkampfreserve und die Startkleidung behalten. Nach Feast darfst du direkt Longbow kaufen, falls danach noch Pfeile und Heilung bezahlbar sind.`,load:`Mit Dagger und Startkleidung: Shortbow 24 / 40; Longbow 30 / 40 bei END 0.`,skip:`Beide Käufe sind keine Pflicht. Shortbow → Longbow nur bei genug Gold; ein vorhandener Shortbow bleibt brauchbar. Direkt Longbow spart 1.000, wenn du die Zeit ohne Bogen sicher überbrücken kannst.`},{item:`Buckler als optionale Nahkampfreserve`,price:`100`,where:`Armourer · alle sechs Städte`,requirement:`Keine Stat-Schwelle · Gewicht 10`,action:`Erst nach Bogen, Pfeilen und Heilreserve. Der Schild kostet zusätzliche Last; für mehr Beweglichkeit kannst du den Slot frei lassen.`,load:`Mit Startkleidung und Dagger: Shortbow-Set 24 → 34; Longbow-Set 30 → 40 / 40 bei END 0.`,skip:`Mit Longbow bei END 0 bleibt keine Lastreserve. Keine Gloves oder Cloak ergänzen. Round Shield direkt kostet 200 und wiegt 12: mit Longbow-Startset 42, deshalb hier erst ab END 5.`},{item:`Leather Gloves für den freien Handslot`,price:`300`,where:`Armourer · alle sechs Städte`,requirement:`Keine Stat-Schwelle · Gewicht 2`,action:`Mit Longbow und Buckler bis Lifesight / END 5 warten. Cap, Tunic und Leggings besitzt du schon; dafür kein Gold ausgeben.`,load:`Longbow + Dagger + Startkleidung + Buckler: 40 → 42 / 50,71 bei END 5.`,skip:`Mit Shortbow und Buckler wären Gloves schon bei END 0 möglich: 36 / 40. Bei knappem Gold weiter warten.`},{item:`Dagger bei Bedarf durch Mace ersetzen`,price:`1.000`,where:`Weaponsmith · alle sechs Städte`,requirement:`Mace END 5 · Gewicht 4 → 12`,action:`Lifesight erfüllt die Anforderung. Mit Longbow bleibt das Set dann aber fast voll; als Standard bis Blind Leap / END 10 den Dagger behalten. Mace hat Stealth −1.`,load:`Voriges 42er-Set: 42 − 4 + 12 = 50. Bei END 5 nur 0,71 frei; bei END 10 Kapazität 61,43. Amulett nach Fund: 51.`,skip:`Dagger ist anlegbar ohne Stat-Schwelle und bleibt eine leichte Reserve. Mace ist kein Pflichtkauf; für Sleathen brauchst du weiterhin Tooth of Sleathen.`},{item:`Cotton Tunic durch Leather Armour ersetzen`,price:`800`,where:`Armourer · alle sechs Städte`,requirement:`Keine Stat-Schwelle · empfohlen ab END 10`,action:`Ein einzelner Körperkauf. Gewicht 8 → 15, Stealth −1. Mit der schwereren Mace zuerst die Lastreserve prüfen.`,load:`Longbow + Mace + leichte Kleidung + Gloves + Buckler + Amulett: 51 − 8 + 15 = 58 / 61,43 bei END 10.`,skip:`Ohne Amulett 57. Mit Dagger statt Mace jeweils 8 weniger: Leder kann dann früher passen. Bei Goldmangel Cotton Tunic behalten.`},{item:`Cap durch Pointed Cap oder Leather Helmet ersetzen`,price:`Pointed Cap 1.600 · Leather Helmet 400`,where:`Pointed Cap: Armourer in Red Grove · Leather Helmet: alle sechs Städte`,requirement:`Keine Stat-Schwelle · Gewicht 1 / 4`,action:`Für den Bogen ist Pointed Cap das Ziel: +20% phys. Fernkampfschaden und Reichweite +2 ohne zusätzliche Last. Leather Helmet ist die günstigere Schutzalternative. Nur eines der Teile kaufen, nachdem die Versorgung bezahlt ist.`,load:`Voriges 58er-Set: mit Pointed Cap weiterhin 58; mit Leather Helmet 58 − 1 + 4 = 61 / 72,14 bei END 15. Die folgenden Beispiele rechnen mit Leather Helmet; mit Pointed Cap jeweils 3 weniger.`,skip:`Pointed Cap darf früher kommen, sobald 1.600 plus Versorgungsgold übrig sind. Cap behalten, wenn Gold fehlt; Leather Helmet mit Mace und Lederkörper erst bei genügend Lastreserve.`},{item:`Leggings durch Leather Greaves ersetzen`,price:`600`,where:`Armourer · alle sechs Städte`,requirement:`Keine Stat-Schwelle · Gewicht 1 → 6`,action:`Als separaten nächsten Kauf durchführen, falls noch Gold nach der Versorgung übrig ist.`,load:`Voriges 61er-Set: 61 − 1 + 6 = 66 / 72,14 bei END 15.`,skip:`Leggings behalten spart 600 Gold und 5 Last. Kein kompletter Rüstungskauf auf einmal nötig.`},{item:`Buckler durch Round Shield ersetzen`,price:`200`,where:`Armourer · alle sechs Städte`,requirement:`Keine Stat-Schwelle · Gewicht 10 → 12`,action:`15% statt 10% Basis-Blockchance für 2 mehr Last. Als günstiges spätes Upgrade, wenn du überhaupt einen Schild benutzt.`,load:`Voriges 66er-Set: 66 − 10 + 12 = 68 / 72,14 bei END 15.`,skip:`Round Shield darf direkt kommen, sobald dein tatsächliches Set genug Platz hat. Buckler dann nicht zusätzlich kaufen. Ohne Schild bleibt der Build leichter.`}]},je=[{title:`Erster Abschluss`,text:`Alle fünf Relikte sammeln: Steadfast Hand, All-seeing Eye, Trickster's Mask, Crimson Candle und Pale Heart. Für die DX-Route zuerst The Egg abschließen. Nach Moon-upon-Thoss zum Archon zurückkehren und mit dem Thron interagieren. Das löst das erste Ende aus. Wenn du die alternative Route möchtest, vor der Throninteraktion weiterlesen.`},{title:`Roche und die Glocke`,text:`Mit Black Eyed Stone zu Hermit's Hut auf der Insel nordwestlich Red Grove (Welt 140,172), per Schiff oder bekannter Henge-Verbindung. Gespräch: Roche → lives → Serpents → guardian → nothing → learned much / gods / move on → Tether → true names → too old → shades → free them. Tarthus notieren und Roche's Bell nehmen.`},{title:`Vier Geister finden`,text:`Die Glocke weist zur nächsten offenen Stelle. Auf der Weltkachel in Lokalansicht wechseln und in der Nähe klingeln: Yarrow am Wasser nordwestlich der Farm (lokal 26,43), Weltmeer (224,397), Sumpf südlich Harrowdus (312,333), Kraterrand nördlich Wintersholl (302,80). Geister besiegen und Caryon, Anun, Balatoth, Hezreh erfahren. Wiederholtes Klingeln kann Statusbelastungen verursachen.`},{title:`Issacarr öffnen`,text:`Bael's Key aus der Ossuary in Barrow-Linn am geschützten südlichen Stein in Issacarr, südöstlich Harrowdus (317,319), anwenden. Nostacarr (404,371) wird aktiv. Die Südseite der Henge-Verbindung benutzen: vom Norden zur Warpmitte gehen. Auf der Finaleinsel liegt The Lament nördlich des Henges (404,364).`},{title:`Vor The Lament`,text:`Nach allen fünf Relikten ist dies die empfohlene Fortsetzung; kein zusätzliches Relikt-Gate am Eingang wird behauptet. The Egg vorher abschließen. Alles danach erneut auffüllen: Heilung, Energie, Ammo, Statusmittel. Fünf Arenen und eine sechste Boss-Ebene; der Eingang schließt. Passende normale Ausrüstung genügt als Ziel, keine Legendary-Pflicht.`},{title:`Die fünf Altäre`,text:`Im Tether-Raum Bodensymbole beachten; Altäre stehen je nach Run unterschiedlich. In Rufreichweite 2 am passenden Altar den Namen rufen: Wolf Tarthus; Harlequin Caryon; Dust Anun; Lady Balatoth; Angels Hezreh. Nach allen fünf erlischt der Schild; dann Tether bekämpfen. Todesblick kann aus Distanz 4 gefährlich werden: Blicklinie vermeiden. Der letzte Altar löst zudem einen Lebens-/Statusangriff auf dich und deine Helfer aus.`},{title:`Nach dem finalen Kampf`,text:`The Lament verlassen. Dadurch verändert sich die Welt und die göttlichen Gaben, Devotion und Eid werden zurückgesetzt; Attributwerte und normale Ausrüstung bleiben wichtig. Für den Abschluss nach Moon-upon-Thoss zum Archon und mit dem Thron interagieren. Danach keine Kampfroute mehr auf Feast oder Howl aufbauen.`}],Me=0;Array.isArray;function Z(t,n,r,i,a,o){n||={};var s,c,l=n;if(`ref`in l&&typeof t!=`function`)for(c in l={},n)c==`ref`?s=n[c]:l[c]=n[c];var u={type:t,props:l,key:r,ref:s,__k:null,__:null,__b:0,__e:null,__c:null,constructor:void 0,__v:--Me,__i:-1,__u:0};return(a||o)&&(u.__source=a,u.__self=o),e.vnode&&e.vnode(u),u}function Ne({build:e,checked:t,toggle:n,reset:r}){let i=X.findIndex(e=>!t[e]),a=()=>i<0?9:Math.floor(i/10),[o,s]=U(a),[c,l]=U(!1),u=X.filter(e=>t[e]).length;he(()=>{s(a()),l(!1)},[e]);let d=Array.from({length:10},(e,t)=>o*10+t+1);return Z(`section`,{class:`egg-guide`,"aria-labelledby":`egg-guide-title`,children:[Z(`h3`,{id:`egg-guide-title`,children:`Im Egg: dein laufender Versuch.`}),Z(`p`,{children:`Etagen 1–99 werden für jeden Lauf erzeugt. Folge der Abstiegsroutine; die Liste hält fest, welche Etagen du tatsächlich abgeschlossen hast.`}),Z(`div`,{class:`condition-note`,children:[Z(`strong`,{children:`Ein langer Dungeon, mit Speicherpause`}),Z(`p`,{children:`Keine bestätigten Zwischen-Checkpoints oder Einkaufsportale. Auf 2–99 kannst du innerhalb des Eggs zurücktreppen. Für eine längere Pause: stillstehen, Escape → Options → Save and Quit. Laden setzt diesen unterbrochenen Lauf fort; ein Tod im Normalmodus setzt ihn auf den Stand vor Eintritt zurück.`})]}),Z(`details`,{class:`help-details`,children:[Z(`summary`,{children:`Meine Routine auf jeder Etage`}),Z(`ol`,{children:[Z(`li`,{children:`Rückzugsfelder sichern, mit Lifesight verdeckte Gegner prüfen und Revelation für Fallen nutzen. Normale Treffer sind der Standard und liefern Energie; Warten füllt weder HP noch Spielerenergie.`}),Z(`li`,{children:`Abstieg finden. Ist der Durchgang gesperrt, nötige lokale Schlüssel oder Mechanismen suchen: Haupt-Miniboss, weitere Minibosse, erreichbare Truhen und Druckplatten. Kein mitgebrachter storyweiter Master Key ist als Egg-Ausweg vorgesehen.`}),Z(`li`,{children:`Nur sinnvolle Beute und Reserven hnen: eine Fernwaffe kommt zur Nahkampfwaffe hinzu. Auf ein bereits überladenes 45 / 40-Set keine weitere Waffe legen. Erst leichter ausrüsten oder mehr END erreichen. Fehlt Versorgungsgold, den Kauf und die Hirschjagd verschieben.`})]}),Z(`details`,{class:`help-details`,children:[Z(`summary`,{children:`Gewicht, Dodge, Stealth und die Vorschau verstehen`}),Z(`p`,{children:[`Im Laden und Inventar zeigt die Charakteranzeige eine `,Z(`strong`,{children:`Vorschau des Austauschs`}),`. Das Markieren allein legt das Teil noch nicht an und kauft es nicht. Die Vergleichswerte zeigen, was mit dem ausgewählten Teil im passenden Slot passieren würde.`]}),Z(`ul`,{class:`gear-rules`,children:[Z(`li`,{children:[Z(`strong`,{children:`Anlegbar:`}),` Die tatsächlichen STR-, PER-, END-, FIN- und INT-Anforderungen sowie freie Hände entscheiden. Greatsword braucht zwei Hände und lässt keinen Schild zu. Lifesight gibt END 5, Blind Leap END 10, Retribution END 15; die angezeigten Attribute zählen, nicht allein dein Level.`]}),Z(`li`,{children:[Z(`strong`,{children:`Last und Dodge:`}),` Mehr ausgerüstetes Gewicht verlangsamt Bewegung und senkt darüber Dodge, auch unter der Kapazität. Über der Kapazität wird die Belastung noch ungünstiger. Die Grenze ist keine Anlegesperre; für diesen Anfängerweg bleiben wir darunter und möglichst mit Reserve.`]}),Z(`li`,{children:[Z(`strong`,{children:`Stealth:`}),` Manche Teile haben eigene Abzüge, unabhängig vom Gewicht. Leather Armour, Heater Shield und Mace haben jeweils −1; zusammen addiert sich das. Woolen Cloak gibt +1, wiegt aber 4. Ein schwereres Teil mit mehr Schutz verbessert deshalb nicht alle Werte.`]}),Z(`li`,{children:[Z(`strong`,{children:`Abwägen:`}),` Mehr Rüstung oder Blockchance gegen weniger Dodge, Beweglichkeit und gegebenenfalls Stealth vergleichen. Für Nahkampf kann das sinnvoll sein; beim Abstandhalten lieber leicht bleiben. Ein roter Vergleichswert allein bedeutet keinen Fehlkauf.`]})]})]}),Z(`details`,{class:`help-details`,childr ellen müssen tatsächlich erreicht sein; ein leichterer Zwischenstand ist ausdrücklich brauchbar.`}),Z(`div`,{class:`loadouts`,children:ke[e].map(e=>Z(`section`,{children:[Z(`div`,{children:[Z(`h4`,{children:e.phase}),Z(`span`,{children:[e.load,` Last`]})]}),Z(`p`,{children:e.items}),Z(`p`,{class:`small-note`,children:e.note})]},e.phase))}),Z(`details`,{class:`help-details`,children:[Z(`summary`,{children:`Späte Alternativen: Kite Shield, Steel Helmet, Greatsword und Platemail`}),Z(`p`,{children:`Das sind einzelne Alternativen für einen bewussten Umbau. Sie gehören nicht zum sparsamen Standardweg.`}),Z(`ul`,{children:[Z(`li`,{children:[Z(`strong`,{children:`Kite Shield`}),` · Basis 1.600, Armourer überall. Gewicht 18, Stealth −2, 30% Basis-Blockchance. Gegenüber Heater nur 5 Prozentpunkte mehr bei 2 mehr Last; direkt kaufen ist erlaubt, wenn dein Set und Budget passen.`]}),Z(`li`,{children:[Z(`strong`,{children:`Steel Helmet`}),` · Basis 1.000, Wintersholl/Hearthaven. Gewicht 12 statt Leather Helmet 4, Stealth −1. Der Austausch ergänzt 8 Last; zuerst nachrechnen.`]}),Z(`li`,{children:[Z(`strong`,{children:`Greatsword`}),` · Basis 8.000, Wintersholl. STR 20, Gewicht 18, Stealth −2. Vor dem Anlegen den Schild ablegen; danach hast du einen anderen Kampfaufbau.`]}),Z(`li`,{children:[Z(`strong`,{children:`Platemail Armour`}),` · Basis 4.000, Hearthaven. Keine Stat-Schwelle, Gewicht 40, Stealth −3. Gegenüber Leather Armour kommen 25 Last dazu. Die übrigen Slots müssen entsprechend leichter werden.`]})]})]})]})}var He=[{id:`hidden-heart`,title:`Das Herz hinter der Friedhofsmauer`,introduction:`„My heart hides behind a word made by walls“: Die Friedhofsinschrift und sechs Wandinschriften gehören zusammen. Notiere jeden gefundenen Buchstaben im Spiel.`,destination:`Moon-upon-Thoss · Friedhof`,destinationStageId:`capital`,clues:[{id:`clue-heart-riddle`,stageId:`capital`,revisit:[`prepare`],title:`Friedhofsinschrift gelesen`,how:`Im Friedhof der Hauptstadt von den Gräbern ostwärts zur Mauer gehen. Die im Gras verborgene Inschrift untersuchen.`,anchor:`Moon-upon-Thoss, lokal (77,47).`,source:`Moon-upon-ThossTriggers.csv:46; strings.lua:60`},{id:`clue-wall-capital`,stageId:`capital`,revisit:[`prepare`],title:`Wandinschrift in Moon-upon-Thoss gelesen`,how:`Im westlichen Stadtteil nahe Hafen und Fährmann die Mauerinschrift untersuchen und den Buchstaben notieren.`,anchor:`Moon-upon-Thoss, lokal (20,72).`,source:`Moon-upon-ThossTriggers.csv:61; strings.lua:58`},{id:`clue-wall-winter`,stageId:`winter`,title:`Wandinschrift in Wintersholl gelesen`,how:`Im nordwestlichen Stadtbereich die Mauerinschrift suchen, untersuchen und den Buchstaben notieren.`,anchor:`Wintersholl, lokal (27,28).`,source:`WintershollTriggers.csv:24; strings.lua:55`},{id:`clue-wall-hearth`,stageId:`hearth`,title:`Wandinschrift in Hearthaven gelesen`,how:`Östlich der Stadtmitte die Mauerinschrift untersuchen und den Buchstaben notieren.`,anchor:`Hearthaven, lokal (55,43).`,source:`HearthavenTriggers.csv:23; strings.lua:53`},{id:`clue-wall-red`,stageId:`red`,revisit:[`prepare`],title:`Wandinschrift in The Red Grove gelesen`,how:`Im nördlichen Stadtbereich die Inschrift an der Mauer beim einzelnen Bücherregal untersuchen und den Buchstaben notieren.`,anchor:`The Red Grove, lokal (43,29); das Bücherregal liegt direkt südwestlich davon.`,source:`The_Red_GroveTriggers.csv:5,14; strings.lua:54`},{id:`clue-wall-harrow`,stageId:`harrow`,title:`Wandinschrift in Harrowdus gelesen`,how:`Im südöstlichen Stadtbereich die Mauerinschrift suchen, untersuchen und den Buchstaben notieren.`,anchor:`Harrowdus, lokal (73,72).`,source:`HarrowdusTriggers.csv:4; strings.lua:57`},{id:`clue-wall-barrow`,stageId:`barrow`,title:`Wandinschrift in Barrow-Linn gelesen`,how:`Südwestlich der Stadtmitte die Mauerinschrift untersuchen und den Buchstaben notieren.`,anchor:`Barrow-Linn, lokal (37,56).`,source:`Barrow-LinnTriggers.csv:28; strings.lua:56`}],solution:[`Die sechs Buchstaben ergeben BYPASS. Sie stammen aus Hearthaven (P), The Red Grove (A), Wintersholl (S), Barrow-Linn (S), Harrowdus (B) und Moon-upon-Thoss (Y); die Reiseroute gibt keine Buchstabenreihenfolge vor.`,`Zur Inschrift an der östlichen Friedhofsmauer von Moon-upon-Thoss zurückkehren. Direkt daneben Y für Yell drücken, BYPASS eingeben und bestätigen. Der Ruf muss nahe der Inschrift erfolgen; die Mauer reagiert nur in einem Umkreis von zwei Kacheln je Achse.`,`Durch die geöffnete Mauer treten und das Herz dahinter aufnehmen. Es erhöht deine maximale Gesundheit. Dies ist ein optionaler Fund, kein Relikt und kein Pflichtschritt für den Build.`],source:`strings.lua:53–60; Moon-upon-ThossTriggers.csv:44,46,50,61; state_game.lua:15952–15954,22063–22100,22161–22170; globals.lua:335`},{id:`jest-phrase`,title:`Die fünf Wörter für Jest`,introduction:`Der Priester in Harrowdus gibt dir ein Rätsel, das fünf verstreute Wörter beschreibt. Auch bereits früher gefundene Wörter zählen: Hake nur ab, was du selbst gelesen oder erkannt hast.`,destination:`Harrowdus · Jest-Eingang`,destinationStageId:`jest`,clues:[{id:`clue-jest-riddle`,stageId:`harrow`,title:`Rätsel des Harrowdus-Priesters erhalten`,how:`Mit dem Priester über Relic → die → insist → phrase sprechen. Seine Notiz nennt die fünf Fundstellen und die Reihenfolge der Wörter.`,anchor:`Gespräch in Harrowdus; das Rätsel steht anschließend in deinen Ingame-Notizen.`,source:`DialogueData.csv:239–245`},{id:`clue-jest-book`,stageId:`red`,revisit:[`prepare`],title:`Das ungewöhnliche Buch in The Red Grove gelesen`,how:`Im nördlichen Stadtbereich das einzelne Bücherregal bei der Mauerinschrift untersuchen. Den Titel des auffälligen weißen Buchs notieren.`,anchor:`The Red Grove, lokal (42,30).`,source:`The_Red_GroveTriggers.csv:14; strings.lua:83`},{id:`clue-jest-trees`,stageId:`winter`,title:`Das Wort in Wintersholls Bäumen erkannt`,how:`Die Bäume im nördlichen Stadtbereich als Ganzes betrachten: Ihre Anordnung bildet ein Wort. Das erkannte Wort notieren; hier gibt es keinen eigenen Notiz-Trigger.`,anchor:`Wintersholl.png: Baumformation nördlich der Stadtmitte.`,source:`strings.lua:84; Wintersholl.png`},{id:`clue-jest-stone`,stageId:`barrow`,title:`Steininschrift bei Four Lake Meet gelesen`,how:`In Barrow-Linn in der Bibliothek das Buch mit der beschädigten Karte lesen: Es markiert Four Lake Meet. Der Ort liegt nordöstlich Wintersholl. Dorthin reisen, in die Lokalansicht wechseln und die Steininschrift im Zentrum untersuchen. Das Wort notieren. Das Kartenbuch allein zählt noch nicht als Wortfund.`,anchor:`Kartenbuch in Barrow-Linn, lokal (39,47); Four Lake Meet auf der Weltkarte (330,190), Stein lokal (46,47).`,source:`strings.lua:85,110; Barrow-LinnTriggers.csv:9; OverworldTriggers.csv:304,362; Four_Lake_MeetTriggers.csv:23`},{id:`clue-jest-bones`,stageId:`hearth`,title:`Notiz bei den Knochen in Hearthaven gelesen`,how:`Im westlichen Stadtbereich die Knochen durchsuchen. Die Notiz lesen und ihr einzelnes Wort notieren.`,anchor:`Hearthaven, lokal (17,53).`,source:`HearthavenTriggers.csv:34; strings.lua:86`},{id:`clue-jest-graves`,stageId:`capital`,revisit:[`prepare`],title:`Das Wort um Henries Grab ermittelt`,how:`Im Friedhof Henrie of the Black Watch finden und die benachbarten Grabsteine lesen. Laut Priesterrätsel die Initialen westlich, südlich und östlich seines Grabes zusammensetzen. Erst abhaken, wenn du das Wort ermittelt hast.`,anchor:`Henries Grab in Moon-upon-Thoss, lokal (69,45); Nachbargräber (67,45), (69,48), (71,45).`,source:`DialogueData.csv:245; strings.lua:64–69; Moon-upon-ThossTriggers.csv:38,43,52,59`}],solution:[`In der Reihenfolge des Priesterrätsels lauten die Wörter: Death (Buch in The Red Grove), Has (Bäume in Wintersholl), Dominion (Stein bei Four Lake Meet), Over (Knochennotiz in Hearthaven), All (Initialen von Albret, Lionne und Larry um Henries Grab).`,`Zum Jest-Eingang im Grocer-Rückraum von Harrowdus gehen, hinter die falsche Wand. Direkt bei der verschlossenen Eingangstür Y für Yell drücken und Death tion-Typen entdecken, legendären Bow finden, Crimson Candle erhalten. Alle sechs ergeben 12; eine Tear ergänzt 13. Wenn du die Legendary-Aufgabe auslässt, brauchst du insgesamt drei Tears. Keine dieser Zählaufgaben ist automatisch beim Ortsbesuch erledigt.`}),Z(`p`,{children:`Angels: Hearthaven (+2) und alle fünf Gottstädte (+2). Für die geplanten 5 Punkte eine Tear ergänzen oder später 100 Untote besiegen (+2). Dust: Barrow-Linn (+2) bezahlt Revelation (1).`}),Z(`p`,{children:`Du musst keine unnatürlichen Aktionen farmen: normal erkunden, sichere Kämpfe bestreiten und bei fehlenden Punkten den betreffenden Kauf verschieben.`}),Z($,{text:`achievements.lua:7–13,32–39,45–65; skill_tree.lua:540–548`})]}),Z(`details`,{class:`help-details`,children:[Z(`summary`,{children:`Optionale späte Ergänzung: Sabotage`}),Z(`p`,{children:`Lords of Dust · 3 Devotion · 100 Grundenergie · +5 INT. Nützlich bei mechanischen Gegnern und Fallen. Nach Revelation kaufen, wenn du genügend Dust-Punkte aus Henges/Ruinen gesammelt hast; keine Pflichtgabe für diese Builds.`})]})]}),n===`secrets`&&Z(Je,{checked:g,toggle:D,stage:y,stages:h,jump:k},p),n===`gear`&&Z(`section`,{class:`reference`,children:[Z(Ve,{build:p,checked:g,toggle:D}),Z($,{text:`ObjectData - Sheet1.csv:4–34,61–69,168–210,317–343; research-equipment.md; player_stats.lua:80–93; inventory_panel.lua:403–429; character_panel.lua:166–170,594–616; state_game.lua:1186–1234,10474–10599,11042–11084,20850–20863; economy.lua:335–390,504–511,684–691,843–850; village_sim.lua:51`}),Z(`h3`,{children:`Amulette: finden statt fest einplanen zu kaufen`}),Z(`p`,{children:`Garden gibt Lightning-bolt Amulet (+20% maximale Energie), Tower Amulet of Wintertree, Jest Heart-shaped Amulet, Necropolis Ghostly Amulet und Repository Vermier's Amulet. Die DX-Vorbereitung steht in Etappe 16; die Preisdetails bleiben dort eingeklappt. Für neutrale Beschwörungen ist Lightning-bolt das erste Ziel. Ein Amulettwechsel kann deine Kapazität wieder unter 120 senken.`}),Z(`details`,{class:`help-details`,children:[Z(`summary`,{children:`Optionale Legendary-Route und ihre Grenzen`}),Z(`p`,{children:`Schiff → Sea Cave → Advanced Cannon → Yeleba im südöstlichen Inselring → Great Key → passende Templetür und Prüfung. Yeleba verlangt die besondere Cannon; normale Waffen reichen nicht.`}),Z(`p`,{children:`Das sind Fundziele, keine Ladenkäufe. Dieser schlanke Wolf-Build endet bei STR 25 und kann Arthrona (STR 30) nicht ohne weitere passende Wolf-Gabe ausrüsten. Der Lady-Build endet bei PER 25: Sightbane verlangt PER 25, Great Arc PER 30. Shield of Warding braucht END 20, während beide Listen bei END 15 enden. Kein fremdes Attribut allein für eine Liste ausbauen.`}),Z(`p`,{children:`Legendäre Waffen sind kein Zwang für die empfohlene Hauptroute. Physisch immune Gegner verlangen ein geeignetes magisches Werkzeug oder einen passenden Helfer; normaler Waffenschaden allein genügt nicht immer.`}),Z($,{text:`ActorData.csv:188; ObjectData.csv:30–34,67–69,210; treasure_sets.lua:863–869`})]})]}),n===`basics`&&Z(`section`,{class:`reference`,children:[Z(`h2`,{children:`Die paar Regeln, die den Einstieg leichter machen.`}),Z(`section`,{children:[Z(`h3`,{children:`Gaben kaufen bedeutet keinen Eid`}),Z(`p`,{children:`Du kannst Gaben mehrerer Götter kaufen und benutzen, ohne „Devote yourself“ zu wählen. Beide Builds sind dafür geplant. Aufgabenpunkte gehören ihrem Gott; eine Devotional Tear gibt genau einen frei zugeordneten Punkt. Alle Gaben sind grundsätzlich von Beginn an im Menü verfügbar – genügend Punkte und Einsatzbedingungen entscheiden.`})]}),Z(`section`,{children:[Z(`h3`,{children:`Energie und Mondrabatt richtig lesen`}),Z(`p`,{children:`In deiner Version beträgt der passende Mondrabatt 10 Energie. Ein gültiger Eid halbiert vorher nur die Grundkosten der Gaben dieses Gottes. Beispiel Feast: neutral 60, bei passendem Mond 50; Lady-Eid 30, mit passendem Mond 20.`}),Z(`p`,{children:`Die Startkapazität ist 100. Howl und Moonlight kosten neutral 120, mit Mond noch 110: beides passt anfangs nicht. Das Garden-Amulett hebt 100 auf 120. Nach einer Beschwörung ist die Leiste dann leer; keine sofortige Heil- oder Fluchtkombo voraussetzen.`})]}),Z(`section`,{children:[Z(`h3`,{children:`Poise, Gesundheit und Rückzug`}),Z(`p`,{children:`Nicht jeden Zug stumpf angreifen. Mit guter Poise in Kämpfe gehen, Gegner einzeln heranholen, Engpässe nutzen und vor einer Notlage Abstand schaffen. Feast benötigt ein geeignetes Ziel und ersetzt deine Heiltrankreserve nicht. Neutralität lässt dir normale Nahrung und freie Rückzugsentscheidungen.`})]}),Z(`section`,{children:[Z(`h3`,{children:`Eine Route ist kein fester Dungeonplan`}),Z(`p`,{children:`Calderas Geographie ist handgebaut; Dungeonräume werden neu erzeugt. Folge Orten, Zugangsschlüsseln und Zielaufgaben, nicht einer behaupteten Raumfolge. NPC-Namen sind oft zufällig: Rollen und englische Schlüsselwörter sind zuverlässiger. Die im Guide genannten besonderen Namen wie Nevin und Flimpy sind im aktuellen Spiel festgelegt.`}),Z(`p`,{children:`Die siebenstöckigen Reliktdungeons und The Lament sind lange Einsätze mit eingeschränktem Rückzug. Die Eintrittswarnung lesen und vorher auffüllen. Nicht blind alle Side-Dungeons erzwingen.`})]}),Z(`details`,{class:`help-details`,children:[Z(`summary`,{children:`Optional: Wann lohnt sich doch ein Eid?`}),Z(`h3`,{children:`Wolf-Eid`}),Z(`p`,{children:`Howl kostet dann 60, mit Mond 50. Der Eid hilft bei Poise im Kampf, bestraft aber das Verlassen eines Gebiets, während du verfolgt/angezielt wirst. Deshalb erst wählen, wenn du diese Rückzugsregel bewusst möchtest.`}),Z(`h3`,{children:`Lady-Eid`}),Z(`p`,{children:`Moonlight kostet dann 60, mit Mond 50. Blut zählt als Nahrung und Brauen wird günstiger; normale Nahrung ist ein Tabu. Erst mit praktischem Blutvorrat erwägen. Gash liefert bei niedriger PER nicht garantiert Blut; Feast heilt hier Gesundheit, nicht Hunger.`}),Z(`p`,{children:`Ein Eidwechsel verflucht den vorherigen Gott; dessen Gaben können gesperrt werden. Ein passendes Icon verwenden/brennen, um einen Fluch zu lösen. Für den ersten Standarddurchlauf ist ein Eid nicht nötig.`})]}),Z($,{text:`actions.lua:685–708,4960–5047; player_stats.lua:55; skill_tree.lua:157–167,540–548; world_data.lua:148–203; state_game.lua:20367–20728`})]}),n===`sources`&&Z(`section`,{class:`reference`,children:[Z(`h2`,{children:`Nachprüfbar und lokal.`}),Z(`p`,{children:[`Recherche vom `,Z(`strong`,{children:`2. Oktober 2026`}),` für deine installierte PC-Fassung `,Z(`strong`,{children:`0.0.958`}),`, Steam-Build `,Z(`strong`,{children:`24843312`}),`. Die Regeln wurden im ausgelieferten Lua-Code und in den Datentabellen geprüft. Die Spielinstallation und deine Spielstände wurden nicht verändert.`]}),Z(`section`,{children:[Z(`h3`,{children:`Was belegt ist – und was empfohlen`}),Z(`p`,{children:`Namen, Kosten, Stat-Schwellen, Last, Bestände und Zugangstore sind aus den Spieldaten. Build-Reihenfolge, Einkaufsprioritäten und Reliktreihenfolge sind unsere Empfehlungen. Sie wurden nicht mit einem vollständigen neuen Durchlauf getestet. Gold, Raumfolgen und dynamische Angebote sind keine garantierten Zeitpunkte.`}),Z(`p`,{children:[`Die Quelle ist das ZIP-Archiv in deiner Moonring.exe unter `,Z(`code`,{children:`~/.local/share/Steam/steamapps/common/Moonring/`}),`. „Spieldaten“-Hinweise nennen interne Dateinamen und Zeilen. „DialogueData.csv“ ist die Kurzform von `,Z(`code`,{children:`data/DialogueData - Sheet1.csv`}),`; entsprechend für ObjectData und ActorData. Ortsdateien liegen unter `,Z(`code`,{children:`data/save/`}),`.`]}),Z(`p`,{children:[`Ausführliche lokale Belege: `,Z(`a`,{href:`./research-powers.md`,target:`_blank`,children:`research-powers.md`}),`, `,Z(`a`,{href:`./research-route.md`,target:`_blank`,children:`research-route.md`}),`, `,Z(`a`,{href:`./research-egg.md`,target:`_blank`,children:`research-egg.md`}),`, `,Z(`a`,{href:`./research-cemetery.md`,target:`_blank`,children:`research-cemetery.md`}),`, `,Z(`a`,{href
